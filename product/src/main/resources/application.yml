server:
  port: 8030
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/practice
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: PRODUCT-SERVICE

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

resilience4j:
  ratelimiter:
    instances:
      userRateLimiter:
        limit-refresh-period: 10s
        limit-for-period: 2
        timeout-duration: 30s