server:
  port: 8010

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:
        - id: USER-SERVICE
          uri: http://localhost:8020
          predicates:
            - Path=/user/**

        - id: PRODUCT-SERVICE
          uri: http://localhost:8030
          predicates:
            - Path=/product/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka